[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-graph-rag-bilingualism"
version = "0.1.0"
description = "Independent English upstream and evidence-driven Chinese RAG pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["chardet>=5,<6", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
english = ["vector-graph-rag @ git+https://github.com/zilliztech/vector-graph-rag.git@47590ad4eab5838cdcfec94f8a53ebfe70ebe330"]
jev = ["vector-graph-rag @ git+https://github.com/zilliztech/vector-graph-rag.git@47590ad4eab5838cdcfec94f8a53ebfe70ebe330"]
milvus = ["pymilvus>=2.4,<2.6.10"]
documents = ["pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6"]
tokenizer = ["tokenizers>=0.20,<1"]
test = ["pytest>=8,<10", "reportlab>=4,<5", "python-docx>=1.1,<2"]

[project.scripts]
vgrag-bi = "vector_graph_rag_bilingualism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
